name: Refresh Contribution Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bake the theme-matched heatmap (ghchart, recolored) and the streak card
      # (streak-stats, kept only when it returns a valid card) into committed SVGs
      # so the README loads them by relative path and they always render even when
      # the upstream services rate-limit. [skip ci] keeps the auto-commit from
      # retriggering this workflow.
      - name: Bake cards + commit to assets on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bake_heatmap.py "${{ github.repository_owner }}"
          python3 scripts/bake_streak.py "${{ github.repository_owner }}"
          python3 scripts/gen_activity.py "${{ github.repository_owner }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-dark.svg assets/heatmap-light.svg assets/streak.svg assets/activity.svg
          git diff --quiet --cached || git commit -m "chore: refresh contribution cards [skip ci]"
          git push
