<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  #banner {
    width: 1200px; height: 300px; position: relative; overflow: hidden;
    background:
      radial-gradient(120% 140% at 88% -20%, rgba(13,148,136,0.10), transparent 55%),
      radial-gradient(90% 120% at 100% 120%, rgba(34,211,238,0.10), transparent 50%),
      linear-gradient(180deg, #ffffff 0%, #f2f5f9 100%);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }
  #banner::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #0d9488 30%, #0891b2 55%, transparent);
    opacity: 0.95;
  }
  .content { position: absolute; left: 72px; top: 62px; right: 72px; z-index: 2; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;
    letter-spacing: 3px; color: #0f766e; text-transform: uppercase; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: #0d9488; }
  .name {
    font-size: 62px; font-weight: 600; letter-spacing: 7px; color: #0b1220; line-height: 1;
  }
  .rule { width: 108px; height: 2px; margin: 20px 0 18px;
    background: linear-gradient(90deg, #0d9488, #0891b2); border-radius: 2px; }
  .tagline { font-size: 23px; font-weight: 400; color: #55627a; letter-spacing: 0.3px; }
  .tagline b { color: #1f2937; font-weight: 600; }
  .tagline .accent { color: #0f766e; font-weight: 600; }
  .term {
    position: absolute; left: 72px; bottom: 40px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #6b7688;
    display: flex; align-items: center; gap: 2px;
  }
  .term .prompt { color: #0f766e; margin-right: 8px; }
  .term .cursor { display: inline-block; width: 9px; height: 17px; margin-left: 6px;
    background: #0d9488; transform: translateY(2px); }
</style>
</head>
<body>
  <div id="banner">
    <div class="content">
      <div class="eyebrow"><span class="dot"></span>Software Engineer</div>
      <div class="name">VEDANTH&nbsp;&nbsp;M&nbsp;S</div>
      <div class="rule"></div>
      <div class="tagline"><b>Backend systems</b> &amp; <span class="accent">AI-integrated</span> applications</div>
    </div>
    <div class="term"><span class="prompt">&gt;</span>building systems that make decisions in milliseconds<span class="cursor"></span></div>
  </div>
</body>
</html>
